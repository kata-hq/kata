# Local Postgres. One container for every worktree (fixed project name); worktrees isolate by database name.
name: kata

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: kata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kata
      POSTGRES_PASSWORD: kata
      # Created on the first start. Other databases (tests, worktrees) are created by the db scripts.
      POSTGRES_DB: ${POSTGRES_DB:-kata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - kata-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kata -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Profile "app": the production images against this Postgres (`bun run docker:up`). Not started by `db:up`.
  # The api and web images read config from env only. Override DOCKER_* in `.env` or the shell.
  migrate:
    profiles: ["app"]
    image: kata-api
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["migrate"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://kata:kata@postgres:5432/kata}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    image: kata-api
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://kata:kata@postgres:5432/kata}
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Local stack only: set DOCKER_BETTER_AUTH_SECRET for anything shared.
      BETTER_AUTH_SECRET: ${DOCKER_BETTER_AUTH_SECRET:-local-docker-secret-not-for-production}
      BETTER_AUTH_URL: http://localhost:${DOCKER_WEB_PORT:-8080}
    ports:
      - "${DOCKER_API_PORT:-3080}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    profiles: ["app"]
    image: kata-web
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: http://api:3000
      WEB_PORT: 8080
    ports:
      - "${DOCKER_WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }

volumes:
  kata-pgdata:
