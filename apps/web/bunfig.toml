[test]
preload = ["./test/happy-dom.ts", "./test/setup.ts"]
# `bun run test:coverage` fails when a file is below 90% lines. Excluded: test setup, the entry file (entry.server.tsx),
# and other workspaces (each measures its own coverage).
# The gate is on lines only: `functions = 0` because Bun otherwise applies the threshold to functions too.
coverageThreshold = { lines = 0.9, functions = 0 }
coveragePathIgnorePatterns = ["test/**", "app/entry.server.tsx", "../../packages/**", "../api/**"]
