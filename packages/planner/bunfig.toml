[test]
# `bun run test:coverage` fails when a file is below 90% lines. Excluded: other workspaces (each measures its own coverage).
# The gate is on lines only: `functions = 0` because Bun otherwise applies the threshold to functions too.
coverageThreshold = { lines = 0.9, functions = 0 }
coveragePathIgnorePatterns = ["../../packages/shared/**", "../shared/**"]
