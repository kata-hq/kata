# Claude reviews every PR that is ready for review with `/review-pr <number>` and posts the result as a comment.
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN and the Claude GitHub App (see docs/workflow.md, "GitHub automation").
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# A new push replaces the review in progress: only the latest commit is reviewed.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  POSTGRES_PORT: 5432
  DATABASE_URL: postgres://kata:kata@localhost:5432/kata
  TEST_DATABASE_URL: postgres://kata:kata@localhost:5432/kata_test
  LOG_LEVEL: warn

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    # `/review-pr` runs `bun run check` and `bun run e2e` on the PR.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: kata
          POSTGRES_PASSWORD: kata
          POSTGRES_DB: kata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kata -d kata"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for the e2e tests
        working-directory: apps/e2e
        run: bun x playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /review-pr ${{ github.event.pull_request.number }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(bun:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),mcp__github_inline_comment__create_inline_comment"
