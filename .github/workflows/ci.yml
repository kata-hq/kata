# Every PR to main and every push to main: the gates of `bun run check`, the e2e suite and both Docker images.
# Branch protection on main requires the three jobs below: check, e2e, docker (see docs/workflow.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces the running checks. Runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  # Same values as .env.example. Postgres is the job's service container, so no script starts docker compose.
  POSTGRES_PORT: 5432
  DATABASE_URL: postgres://kata:kata@localhost:5432/kata
  TEST_DATABASE_URL: postgres://kata:kata@localhost:5432/kata_test
  LOG_LEVEL: warn

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same image as compose.yaml.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: kata
          POSTGRES_PASSWORD: kata
          POSTGRES_DB: kata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kata -d kata"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Migrate the database
        run: bun run db:migrate
      - name: Check (biome, typecheck, unit tests + 90% coverage gate, integration, architecture)
        run: bun run check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: kata
          POSTGRES_PASSWORD: kata
          POSTGRES_DB: kata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kata -d kata"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("./apps/e2e/package.json").devDependencies["@playwright/test"])')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/e2e
        run: bun x playwright install --with-deps chromium
      - name: Install Chromium system dependencies (browser from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/e2e
        run: bun x playwright install-deps chromium
      # Starts its own isolated instance (database kata_e2e_<name>, migrated and seeded) on the service Postgres.
      - name: End-to-end tests
        run: bun run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Same builds as `bun run docker:build`. One job (not a matrix) so branch protection requires one `docker` check.
      - name: Build kata-api (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          tags: kata-api:ci
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build kata-web (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          tags: kata-web:ci
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
