# Claude Code on GitHub (see docs/workflow.md, "GitHub automation"):
# - `@claude` in an issue, a comment or a review: Claude answers or does the work asked.
# - label `agent` on an issue: Claude runs `/build-issue <number>` (implements the issue and opens a PR).
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN and the Claude GitHub App on the repository.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

# One run at a time per issue or PR. A second request waits; it never cancels work in progress.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2
  POSTGRES_PORT: 5432
  DATABASE_URL: postgres://kata:kata@localhost:5432/kata
  TEST_DATABASE_URL: postgres://kata:kata@localhost:5432/kata_test
  LOG_LEVEL: warn

jobs:
  claude:
    # Bots never trigger a run: Claude's own comments and labels must not start another one.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'assigned') &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # Claude runs `bun run check` and `bun run e2e` against this Postgres, as a developer does locally.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: kata
          POSTGRES_PASSWORD: kata
          POSTGRES_DB: kata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kata -d kata"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for the e2e tests
        working-directory: apps/e2e
        run: bun x playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Label `agent`: a fixed prompt (automation mode). Mentions: no prompt, the action answers the `@claude` request.
          prompt: ${{ (github.event_name == 'issues' && github.event.action == 'labeled') && format('/build-issue {0}', github.event.issue.number) || '' }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(bun:*),Bash(bun x:*),Bash(git:*),Bash(gh:*)"
